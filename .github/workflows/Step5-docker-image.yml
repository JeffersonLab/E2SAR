name: Step 5 - Build and push Docker image

on:
  workflow_dispatch:
    inputs:
      e2sar_ver:
        description: 'E2SAR version (used as Docker tag and DEPS_VER build arg)'
        default: '0.4.0a1'
        type: string
        required: true
      push_latest:
        description: 'Also tag as ibaldin/e2sar:latest'
        default: 'true'
        type: boolean
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout E2SAR code
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: v${{ inputs.e2sar_ver }}
          fetch-tags: true
          token: ${{ secrets.CLASSIC_REPO_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64
          push: true
          build-args: |
            DEPS_VER=${{ inputs.e2sar_ver }}
          tags: |
            ibaldin/e2sar:${{ inputs.e2sar_ver }}
            ${{ inputs.push_latest == 'true' && 'ibaldin/e2sar:latest' || '' }}
